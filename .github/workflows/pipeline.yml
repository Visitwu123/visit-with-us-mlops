name: Visit With Us MLOps Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write


# -----------------------------------------
# STEP 1: DATA PREPARATION
# -----------------------------------------

jobs:

  data-prep:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install data dependencies
        run: |
          pip install pandas scikit-learn

      - name: Verify project files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          ls -la

          echo ""
          echo "Tourism project structure:"
          ls -R tourism_project

      - name: Run data preparation
        run: |
          python tourism_project/model_building/data_prep.py

      - name: Verify generated datasets
        run: |
          echo "Generated datasets:"
          ls -lh tourism_project/data

      - name: Upload train and test datasets
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/data/train.csv
            tourism_project/data/test.csv
  model-training:

  runs-on: ubuntu-latest

  needs: data-prep

  steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download train and test datasets
      uses: actions/download-artifact@v4
      with:
        name: data-splits
        path: tourism_project/data

    - name: Verify downloaded datasets
      run: |
        echo "Downloaded datasets:"
        ls -lh tourism_project/data

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install pandas scikit-learn mlflow joblib

    - name: Run model training
      run: |
        python tourism_project/model_building/model_train.py

    - name: Verify saved model
      run: |
        echo "Model files:"
        ls -lh tourism_project/model_building/

    - name: Upload MLflow tracking
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-tracking
        path: mlruns/

    - name: Commit best model
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add tourism_project/model_building/best_model.joblib

        if git diff --cached --quiet; then
          echo "No model changes to commit."
        else
          git commit -m "Update best model"
          git push
        fi

  # -----------------------------------------
  # STEP 6: APPLICATION VALIDATION
  # -----------------------------------------

  app-validation:

    runs-on: ubuntu-latest

    needs: model-training

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: tourism_project/model_building

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deployment dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify deployment files
        run: |
          test -f app.py
          test -f requirements.txt
          test -f tourism_project/model_building/best_model.joblib

          echo "All deployment files are present."

      - name: Test model loading
        run: |
          python -c "import joblib; joblib.load('tourism_project/model_building/best_model.joblib'); print('Model loaded successfully.')"

      - name: Validate Streamlit application
        run: |
          python -m py_compile app.py

  permissions:
  contents: write
  - name: Configure Git
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    - name: Commit updated model
  run: |
    git add tourism_project/model_building/best_model.joblib

    if git diff --cached --quiet; then
      echo "No model changes to commit."
    else
      git commit -m "Update trained model [skip ci]"
      git push origin HEAD:main
    fi
      - name: Validate Streamlit application
        run: |
          python -m py_compile app.py
